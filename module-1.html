<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTC Blocks Programming - Module 1</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="module1-page lesson-app">

<div class="appbar">
  <nav class="module-links" aria-label="Module navigation">
    <a class="module-link" href="index.html">Home</a>
    <a class="module-link" href="module-2.html"> Module 2 -&mt;</a>
  </nav>
  <h2>FTC Blocks Programming <span>Module 1</span></h2>
  <div class="app-modes">
    <button class="app-mode-btn active" data-view="slidesView">Slides</button>
    <button class="app-mode-btn" data-view="flashView">Flashcards</button>
    <button class="app-mode-btn" data-view="quizAppView">Quiz</button>
  </div>
</div>

<div class="view active" id="slidesView">
  <div class="topbar">
    <span class="count" id="count">1 / 10</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <button class="notes-toggle" id="notesToggle">Facilitator Notes: Off</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="notes-drawer" id="notesDrawer">
    <span class="lbl">FACILITATOR NOTE</span>
    <span id="notesText"></span>
  </div>
  <div class="navbar">
    <button class="nav-btn ghost" id="prevBtn">&lt;- Prev</button>
    <span class="hint">Arrow keys / Space to navigate - N for notes</span>
    <button class="nav-btn" id="nextBtn">Next -&gt;</button>
  </div>
</div>

<div class="view" id="flashView">
  <div class="flash-wrap">
    <div class="fc-progress">
      <span id="fcProgressLabel">0 / 12 reviewed</span>
      <div class="fc-progress-bar"><div class="fc-progress-fill" id="fcProgressFill"></div></div>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>
</div>

<div class="view" id="quizAppView">
  <div class="quiz-outer">
    <div class="quiz-wrap" id="quizWrap"></div>
  </div>
</div>

<script src="assets/js/module-1.js"></script>
</body>
</html>
